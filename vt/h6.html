<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>viewport test</title>
<style>
html,body{margin:0;background:#1b1b1b;color:#eaeaea;font:12px/1.45 ui-monospace,monospace}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#000}
#stage iframe{border:0;display:block}
#out{position:absolute;left:404px;top:0;width:1460px;padding:10px 14px;white-space:pre-wrap}
b{color:#ffd84d} i{color:#7ee787;font-style:normal}
</style>
<div id="stage"></div>
<div id="out">loading…</div>
<script>
const p = new URLSearchParams(location.search);
const W = +(p.get('w') || 390), H = +(p.get('h') || 844);
const SAT = p.get('sat') === null ? 28 : +(p.get('sat') || 0);
const SAB = p.get('sab') === null ? 34 : +(p.get('sab') || 0);
const stage = document.getElementById('stage'), out = document.getElementById('out');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const f = document.createElement('iframe');
const GQ = p.get('game') || '';
f.src = '../index.html' + (GQ ? ('?' + GQ) : '');
f.width = W; f.height = H; f.style.width = W + 'px'; f.style.height = H + 'px';
stage.appendChild(f);
let ready = false;
const ERRS = [];
f.onload = () => {
  try {
    const d = f.contentDocument;
    d.documentElement.classList.add('st');
    const st = d.createElement('style');
    st.textContent = 'html{--sat:' + SAT + 'px;--sab:' + SAB + 'px}';
    d.head.appendChild(st);
    try {
      const w = f.contentWindow;
      w.addEventListener('error', e => ERRS.push('error: ' + (e && e.message ? e.message : e)));
      w.addEventListener('unhandledrejection', e => ERRS.push('reject: ' + ((e.reason && e.reason.message) || e.reason)));
      const oc = w.console.error.bind(w.console), ow = w.console.warn.bind(w.console);
      w.console.error = function () { ERRS.push('console.error: ' + Array.from(arguments).map(String).join(' ').slice(0, 140)); oc.apply(null, arguments); };
      w.console.warn = function () { ERRS.push('console.warn: ' + Array.from(arguments).map(String).join(' ').slice(0, 140)); ow.apply(null, arguments); };
    } catch (e) { }
    ready = true;
    if (p.get('card')) setTimeout(() => {
      try {
        const d2 = f.contentDocument, q2 = s2 => d2.querySelector(s2);
        const th = d2.defaultView;
        d2.querySelector('#cardView').style.setProperty('--cv-bg', '#22412f');
        d2.querySelector('#cardView').style.setProperty('--cv-ink', '#f3ecdd');
        d2.querySelector('#cardView').style.setProperty('--cv-line', 'rgba(250,244,230,.26)');
        d2.querySelector('#cardView').style.setProperty('--cv-soft', 'rgba(250,244,230,.82)');
        d2.querySelector('#cardView').classList.add('dark');
        q2('#cvMsg').textContent = '행복한 크리스마스 보내세요. 올해도 함께해 줘서 고마워요!';
        q2('#cvFrom').textContent = 'From. 디자이너리';
        q2('#cvTo').textContent = 'To. 모두에게';
        q2('#cvWhen').textContent = '11월 27일 · 트리에 걸린 엽서';
        q2('#cvOwn').classList.remove('hidden');
        q2('#cvCopy').classList.remove('hidden');
        q2('#cardView').classList.remove('hidden');
      } catch (e) { ERRS.push('card: ' + e); }
    }, 2600);
  } catch (e) { out.textContent = 'SETUP ERR ' + e; }
};
function rect(el) {
  if (!el) return null;
  const b = el.getBoundingClientRect();
  if (!b.width && !b.height) return null;
  return { l: Math.round(b.left), t: Math.round(b.top), r: Math.round(b.right), b: Math.round(b.bottom), w: Math.round(b.width), h: Math.round(b.height) };
}
function L(n, r) { return r ? '  ' + n.padEnd(11) + ' L' + r.l + ' T' + r.t + ' R' + r.r + ' B' + r.b + ' (' + r.w + '×' + r.h + ')' : '  ' + n.padEnd(11) + ' (없음)'; }
function vis(el) { if (!el) return false; const s = getComputedStyle(el); return s.display !== 'none' && s.visibility !== 'hidden' && +s.opacity > 0.5 && el.getBoundingClientRect().height > 0; }
function tick() {
  if (!ready) return;
  try {
    const d = f.contentDocument, q = s => d.querySelector(s);
    const g = f.contentWindow;
    const rows = ['viewport ' + g.innerWidth + '×' + g.innerHeight + '  sat=' + SAT + ' sab=' + SAB + '  ver=' + (q('#appVer') ? q('#appVer').textContent : '?')];
    const menuEl = q('#menu');
    if (menuEl && !menuEl.classList.contains('hidden') && !menuEl.classList.contains('out')) {
      const mcol = q('#menu .mcol'), card = q('#menu .card'), bv = rect(q('#appVer')), sb = rect(q('#bSnd3'));
      rows.push('-- 메인 시트 --');
      rows.push(L('mcol', rect(mcol)) + '  scroll ' + mcol.scrollHeight + '/' + mcol.clientHeight + (mcol.scrollHeight > mcol.clientHeight + 1 ? '  <b>스크롤 필요</b>' : '  <i>한 화면 OK</i>'));
      rows.push(L('card', rect(card)));
      rows.push(L('3btn row', rect(q('#menu .card .row'))));
      rows.push(L('best', rect(q('#best'))));
      rows.push(L('appver', bv));
      rows.push(L('soundBtn', sb) + '  text=' + q('#bSnd3').textContent);
      rows.push(bv && bv.b <= H - 1 ? '<i>버전 줄 화면 안</i>' : '<b>버전 줄 잘림</b>');
      rows.push(sb && sb.t >= 44 ? '<i>소리 버튼 상태바 아래</i>' : '<b>소리 버튼 상태바 안</b>');
    }
    const hud = q('#hud');
    if (hud && hud.classList.contains('on')) {
      const a = rect(q('#rankCard')), c = rect(q('#topC')), r = rect(q('#rightC')), t = rect(q('#toast'));
      const gp = (x, y) => (x != null && y != null) ? (y - x) + 'px' : '?';
      rows.push('-- 주행 HUD --');
      rows.push(L('rankCard', a)); rows.push(L('topC', c)); rows.push(L('rightC', r)); rows.push(L('toast', t));
      rows.push(L('soundBtn', rect(q('#bSnd'))) + '  ic=' + q('#bSnd').querySelector('.ic').textContent);
      rows.push(L('touch L', rect(q('#tL')))); rows.push(L('touch R', rect(q('#tR'))));
      rows.push('<b>간격 L↔C ' + gp(a && a.r, c && c.l) + ' / C↔R ' + gp(c && c.r, r && r.l) + ' / toast↔R ' + gp(t && t.r, r && r.l) + '</b>');
      rows.push(a && c && r && a.t >= 44 && c.t >= 44 && r.t >= 44 ? '<i>세 패널 모두 상태바 아래</i>' : '<b>상태바 침범</b>');
      rows.push(c && r && a && c.r <= r.l && a.r <= c.l ? '<i>가로 겹침 없음</i>' : '<b>가로 겹침</b>');
      const tl = rect(q('#tL'));
      rows.push('주행 버튼 아래 여유 ' + (tl ? H - tl.b : '?') + 'px');
    }
    const res = q('#result');
    if (res && !res.classList.contains('hidden')) {
      const pn = q('#result .panel'), pr = rect(pn);
      rows.push('-- 결과창 --');
      rows.push(L('panel', pr) + '  scroll ' + pn.scrollHeight + '/' + pn.clientHeight + (pn.scrollHeight > pn.clientHeight + 2 ? '  <b>스크롤 있음</b>' : '  <i>한 화면</i>'));
      rows.push(L('rhead', rect(q('#result .rhead'))));
      rows.push(L('×btn', rect(q('#bResX'))));
      rows.push(L('link', rect(q('#bHome'))));
      const nm = q('#rList li:last-child span');
      if (nm) { const w = nm.getBoundingClientRect().width; rows.push('이름 span ' + w.toFixed(1) + ' / 글자 ' + nm.scrollWidth + ' ' + (nm.scrollWidth <= Math.ceil(w + 1) ? '<i>잘림 없음</i>' : '<b>뒤 잘림</b>')); }
      rows.push(pr && pr.t >= SAT && pr.b <= H - SAB ? '<i>패널 위아래 화면 안</i>' : '<b>패널 위아래 넘침</b>');
    }
    const cv = q('#cardView');
    if (cv && !cv.classList.contains('hidden')) {
      const card = q('#cardViewCard'), sh = q('#cvShare'), own = q('#cvOwn'), env = q('.cv-env');
      const cs = getComputedStyle(card);
      rows.push('-- 카드 상세 --');
      rows.push(L('cv-card', rect(card)) + ' padding ' + cs.paddingTop + '/' + cs.paddingRight);
      rows.push(L('cvOwn', rect(own))); rows.push(L('cvShare', rect(sh)));
      rows.push('cv-env ' + (env ? getComputedStyle(env).display : 'none'));
      const foot = rect(q('#cardViewCard .cv-foot')), when = rect(q('#cvWhen'));
      rows.push('본문 좌우 안쪽 여유: ' + (card.getBoundingClientRect().left + parseFloat(cs.paddingLeft)) .toFixed(1) + 'px');
      rows.push(rect(sh) && rect(card) && sh.getBoundingClientRect().top >= card.getBoundingClientRect().bottom ? '<i>공유 버튼이 종이 밖</i>' : '<b>공유 버튼이 종이 안</b>');
      rows.push(rect(card) && rect(card).b <= H - 1 ? '<i>종이 화면 안</i>' : '<b>종이 화면 밖</b>');
    }
    const tb = q('#treebar');
    if (tb && !tb.classList.contains('hidden')) {
      rows.push('-- 트리 --');
      rows.push(L('treebar', rect(tb)) + '  아래 여유 ' + (H - rect(tb).b) + 'px');
    }
    rows.push('-- 오류 --');
    rows.push(ERRS.length ? '<b>' + ERRS.length + '건</b>\n' + ERRS.slice(-8).join('\n') : '<i>없음</i>');
    out.innerHTML = rows.join('\n');
  } catch (e) { out.textContent = 'ERR ' + e; }
}
setInterval(tick, 700);
</script>
</html>
