<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>share card verify</title>
<style>
  html,body{margin:0;background:#1b2030}
  #out{display:flex;justify-content:center;padding:16px}
  #out canvas{width:1080px;max-width:96vw;height:auto;box-shadow:0 10px 40px rgba(0,0,0,.5)}
</style>
</head>
<body>
<iframe id="f" src="./index.html?verify=1" style="position:fixed;left:-3000px;top:0;width:390px;height:800px;border:0" aria-hidden="true"></iframe>
<div id="out"></div>
<script>
  const fr = document.getElementById('f');
  fr.addEventListener('load', async () => {
    try {
      await new Promise(r => setTimeout(r, 3000));
      const w = fr.contentWindow;
      const cv = await w.drawCardCanvas({ theme: 'cream', stamp: 'tree', name: '혜련', toName: '모두에게', message: '메리 크리스마스, 따뜻한 연말 보내세요!' });
      document.getElementById('out').appendChild(cv);
      document.title = 'done';
    } catch (e) { document.title = 'error ' + e.message; }
  });
</script>
</body>
</html>
