<!doctype html>
<html lang="ko"><meta charset="utf-8"><title>viewport test</title>
<style>
html,body{margin:0;background:#1b1b1b;color:#eaeaea;font:12px/1.45 ui-monospace,monospace}
#stage{position:absolute;left:0;top:0;width:390px;height:844px;overflow:hidden;background:#000}
#stage iframe{border:0;display:block}
#out{position:absolute;left:404px;top:0;width:1200px;padding:10px 14px;white-space:pre-wrap}
b{color:#ffd84d}
</style>
<div id="stage"></div>
<div id="out">loading…</div>
<script>
const p = new URLSearchParams(location.search);
const W = +(p.get('w') || 390), H = +(p.get('h') || 844);
const SAT = +(p.get('sat') != null && p.get('sat') !== '' ? p.get('sat') : 47);
const SAB = +(p.get('sab') != null && p.get('sab') !== '' ? p.get('sab') : 34);
const stage = document.getElementById('stage'), out = document.getElementById('out');
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const f = document.createElement('iframe');
f.width = W; f.height = H; f.src = '../index.html';
f.style.width = W + 'px'; f.style.height = H + 'px';
stage.appendChild(f);
let ready = false;
f.onload = () => {
  try {
    const d = f.contentDocument;
    d.documentElement.classList.add('st');
    const st = d.createElement('style');
    st.textContent = 'html{--sat:' + SAT + 'px;--sab:' + SAB + 'px;--hudtop:max(14px,calc(' + SAT + 'px + 8px))}';
    d.head.appendChild(st);
    ready = true;
  } catch (e) { out.textContent = 'INJECT ERR ' + e; }
};
function rect(el) {
  if (!el) return null;
  const b = el.getBoundingClientRect();
  if (!b.width && !b.height) return null;
  return { l: Math.round(b.left), t: Math.round(b.top), r: Math.round(b.right), b: Math.round(b.bottom), w: Math.round(b.width), h: Math.round(b.height) };
}
function line(n, r) { return r ? n.padEnd(12) + ' L' + r.l + ' T' + r.t + ' R' + r.r + ' B' + r.b + ' (' + r.w + '×' + r.h + ')' : n.padEnd(12) + ' (없음)'; }
function tick() {
  if (!ready) return;
  try {
    const d = f.contentDocument;
    const q = s => d.querySelector(s);
    const menu = q('#menu'), hud = q('#hud');
    const menuOn = menu && !menu.classList.contains('out');
    const hudOn = hud && hud.classList.contains('on');
    const rows = [];
    rows.push('vw/vh ' + f.contentWindow.innerWidth + '×' + f.contentWindow.innerHeight + '  sat=' + SAT + ' sab=' + SAB + '  ver=' + (q('#appVer') ? q('#appVer').textContent : 'NONE'));
    rows.push('mode  menu=' + (menuOn ? 'ON' : 'off') + ' hud=' + (hudOn ? 'ON' : 'off') + ' tree=' + (q('#treeCount') && q('#treeCount').classList.contains('on')));
    if (menuOn) {
      const mcol = q('#menu .mcol'), card = q('#menu .card');
      rows.push('-- 메인 시트 --');
      rows.push(line('mcol', rect(mcol)) + ' scroll=' + mcol.scrollHeight + '/' + mcol.clientHeight + ' clip=' + (mcol.scrollHeight > mcol.clientHeight + 1));
      rows.push(line('card', rect(card)) + ' scroll=' + card.scrollHeight + '/' + card.clientHeight + ' clip=' + (card.scrollHeight > card.clientHeight + 1));
      rows.push(line('row(3btn)', rect(q('#menu .card .row'))));
      rows.push(line('best', rect(q('#best'))));
      rows.push(line('appver', rect(q('#appVer'))));
      rows.push(line('soundBtn', rect(q('#bSnd3'))));
      const bv = rect(q('#appVer'));
      rows.push('<b>버전 줄 화면 안? ' + (bv && bv.b <= H - 2 ? 'OK (밑여유 ' + (H - bv.b) + 'px)' : 'CUT') + '</b>');
    }
    if (hudOn) {
      const L = rect(q('#rankCard')), C = rect(q('#topC')), R = rect(q('#rightC')), T = rect(q('#toast'));
      rows.push('-- 주행 HUD --');
      rows.push(line('rankCard', L)); rows.push(line('topC', C)); rows.push(line('rightC', R)); rows.push(line('toast', T));
      rows.push(line('soundBtn', rect(q('#bSnd'))));
      rows.push(line('touch ◀', rect(q('#tL'))));
      rows.push(line('touch ▶', rect(q('#tR'))));
      rows.push('<b>겹침 L↔C ' + (L && C ? (C.l - L.r) + 'px' : '-') + ' / C↔R ' + (C && R ? (R.l - C.r) + 'px' : '-') + ' / toast↔R ' + (T && R ? (R.l - T.r) + 'px' : '-') + '</b>');
      rows.push('<b>HUD 상단 상태바 아래? top=' + (L ? L.t : '-') + ' (sat ' + SAT + ' 초과 ' + (L && L.t >= SAT ? 'OK' : 'NO') + ')</b>');
      rows.push('<b>버튼 하단 여유 ' + (rect(q('#tL')) ? H - rect(q('#tL')).b : '-') + 'px</b>');
    }
    out.innerHTML = rows.join('\n');
  } catch (e) { out.textContent = 'ERR ' + e; }
}
setInterval(tick, 800);
</script>
</html>
