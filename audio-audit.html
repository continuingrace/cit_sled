<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>audio-audit</title>
<style>
  html,body{margin:0;height:100%;font:12px/1.45 ui-monospace,Menlo,monospace;background:#0e1320;color:#dce6f5}
  #wrap{display:flex;height:100%}
  iframe{width:390px;height:100%;border:0;background:#000}
  #side{flex:1;padding:10px;overflow:auto}
  button{margin:2px 2px 6px 0;padding:7px 9px;font-size:12px;border-radius:8px;border:1px solid #3c4a66;background:#1a2438;color:#e8eefb}
  pre{white-space:pre-wrap;margin:8px 0;font-size:12px}
</style>
</head>
<body>
<div id="wrap">
  <iframe id="f"></iframe>
  <div id="side">
    <button id="bH">hidden</button>
    <button id="bV">visible</button>
    <button id="bP">pagehide</button>
    <button id="bS">snapshot</button>
    <pre id="log">loading…</pre>
  </div>
</div>
<script>
const f = document.getElementById('f'), log = document.getElementById('log');
const q = new URLSearchParams(location.search);
const shot = q.get('shot');
f.src = './index.html?r=audit' + (shot ? '&shot=' + encodeURIComponent(shot) : '');
const L = [];
function st(el) { return el ? (el.paused ? 'paused@' : 'PLAY@') + el.currentTime.toFixed(2) : '-'; }
function snap(tag) {
  let w, d;
  try { w = f.contentWindow; d = f.contentDocument; } catch (e) { return 'no frame'; }
  const line = `[${new Date().toISOString().slice(11,19)}] ${tag} | hidden=${d.hidden} | MGA:${st(w.MGA)} BGA:${st(w.BGA)} TGA:${st(w.TGA)} | ctx:${w.AU && w.AU.ctx ? w.AU.ctx.state : '-'} | muted:${w.AU && w.AU.muted} | state:${w.G && w.G.state} tree:${w.G && w.G.treeView}`;
  L.push(line); log.textContent = L.join('\n');
  return line;
}
function setHidden(v) {
  const d = f.contentDocument;
  Object.defineProperty(d, 'hidden', { get: () => v, configurable: true });
  Object.defineProperty(d, 'visibilityState', { get: () => (v ? 'hidden' : 'visible'), configurable: true });
  d.dispatchEvent(new Event('visibilitychange'));
}
document.getElementById('bH').onclick = () => { snap('before-hide'); setHidden(true); setTimeout(() => snap('after-hide '), 350); };
document.getElementById('bV').onclick = () => { setHidden(false); setTimeout(() => snap('after-show '), 600); };
document.getElementById('bP').onclick = () => { snap('before-pagehide'); f.contentWindow.dispatchEvent(new PageTransitionEvent('pagehide', { persisted: false })); setTimeout(() => snap('after-pagehide'), 350); };
document.getElementById('bS').onclick = () => snap('snap');
f.addEventListener('load', () => setTimeout(() => snap('loaded'), 2500));
window.__audit = { snap, setHidden, log: L };
</script>
</body>
</html>
