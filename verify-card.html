<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>verify</title>
<style>
  html,body{margin:0;background:#12161f}
  #out{display:flex;justify-content:center;padding:14px}
  #out canvas{width:1080px;max-width:97vw;height:auto;box-shadow:0 12px 40px rgba(0,0,0,.55)}
</style>
</head>
<body>
<div id="out"></div>
<script>
  var fr = document.createElement('iframe');
  fr.style.cssText = 'position:fixed;left:-3200px;top:0;width:390px;height:800px;border:0';
  fr.setAttribute('aria-hidden', 'true');
  fr.src = './index.html?v=' + Date.now();
  document.body.appendChild(fr);
  var started = false;
  function render() {
    if (started) return;
    started = true;
    setTimeout(function () {
      var w = fr.contentWindow;
      try {
        w.drawCardCanvas({ theme: 'cream', stamp: 'tree', name: '혜련', toName: '모두에게', message: '메리 크리스마스, 따뜻한 연말 보내세요!' })
          .then(function (cv) { document.getElementById('out').appendChild(cv); document.title = 'done'; })
          .catch(function (e) { document.title = 'error ' + (e && e.message); });
      } catch (e) { document.title = 'throw ' + e.message; }
    }, 3000);
  }
  fr.addEventListener('load', render);
  var iv = setInterval(function () {
    try { if (fr.contentWindow && fr.contentWindow.drawCardCanvas) { clearInterval(iv); render(); } } catch (e) { }
  }, 400);
</script>
</body>
</html>
